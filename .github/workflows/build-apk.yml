name: Build Stable Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "signing/**"
      - "*.gradle*"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AI_BLOCKER_SIGNING_PASSWORD: ${{ secrets.AI_BLOCKER_SIGNING_PASSWORD }}
      AI_BLOCKER_KEYSTORE_PATH: ${{ github.workspace }}/.signing/ai-blocker-release.p12
      EXPECTED_CERT_SHA256: 92EA78F691132205CAC50AC631D55E17C2A191FFC203A56F8180721FF980378F

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare stable signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AI_BLOCKER_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Repository secret AI_BLOCKER_SIGNING_PASSWORD is not configured."
            exit 1
          fi
          mkdir -p .signing
          base64 -d signing/ai-blocker-release.p12.enc.b64 > .signing/ai-blocker-release.p12.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000             -in .signing/ai-blocker-release.p12.enc             -out .signing/ai-blocker-release.p12             -pass env:AI_BLOCKER_SIGNING_PASSWORD
          keytool -list -keystore .signing/ai-blocker-release.p12             -storetype PKCS12             -storepass "$AI_BLOCKER_SIGNING_PASSWORD"             -alias ai-blocker >/dev/null

      - name: Build stable release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify stable APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt dump badging "$APK"

          VERIFY_OUTPUT="$($ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK")"
          echo "$VERIFY_OUTPUT"

          ACTUAL_CERT="$(echo "$VERIFY_OUTPUT"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | head -n1             | tr -d ':[:space:]'             | tr '[:lower:]' '[:upper:]')"

          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $ACTUAL_CERT"
            exit 1
          fi

          echo "Stable signing certificate verified: $ACTUAL_CERT"

      - name: Upload stable release APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Mode-Blocker-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
